name: Release Drafter
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7.9.0
        with:
          commitish: master
          filter-by-range: "4.x.x"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
